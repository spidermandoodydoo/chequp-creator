# chequp-creator runtime config: LOCAL profile (this machine, no GPU). For mama's GPUs use
#   python -m cqf --config config.mama.yaml …
# chequp-creator runtime config. Same shape as shorts-factory's config.yaml where the
# concepts overlap (farm.machines, models.wan22, qa.*, publish.mode).

preset: presets/chequp_meta.yaml
data_dir: data
out_dir: out

# --- mama: Linux box, 7x RTX 3090 (24 GB). Reached over Tailscale. --------------------------
# Two jobs compete for the same 7 cards, so production runs in two phases
# (see mama/cq_phase.sh):  plan  = Qwen3-235B in LM Studio across all 7 cards
#                          render = ComfyUI, one server per card, Wan 2.2 b-roll
mama:
  host: 100.75.169.5          # Tailscale; LAN is 192.168.0.193

llm:
  backend: claude_cli         # Claude on this machine writes variants (no mama)
  fallback: anthropic_api
  timeout_s: 600

farm:
  machines: []                # no GPUs here: media scenes use fallback_src (CheqUp's photography)
  probe_timeout_s: 5
  job_timeout_s: 1800

models:
  wan22:                      # identical files to shorts-factory (Comfy-Org fp8 + lightx2v 4-step)
    t2v_high: wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors
    t2v_low: wan2.2_t2v_low_noise_14B_fp8_scaled.safetensors
    t2v_lora_high: wan2.2_t2v_lightx2v_4steps_lora_v1.1_high_noise.safetensors
    t2v_lora_low: wan2.2_t2v_lightx2v_4steps_lora_v1.1_low_noise.safetensors
    i2v_high: wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
    i2v_low: wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
    i2v_lora_high: wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors
    i2v_lora_low: wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors
    text_encoder: umt5_xxl_fp8_e4m3fn_scaled.safetensors
    vae: wan_2.1_vae.safetensors
    width: 720
    height: 1280
    frames: 81                # ~5 s at 16 fps
    fps: 16
    steps: 4
    shift: 8.0

broll:
  candidates: 2               # stills per shot; best one goes to i2v
  qa: claude_vision           # claude_vision | none — checks stills for banned imagery/people-as-members
  max_rerolls: 2

render:
  formats: ["9x16", "4x5", "1x1"]
  fps: 30
  jobs: 4                     # parallel Chromium pages
  node: node

voice:
  backend: tts                # tts | none  (engine per line: presets/*.yaml voice block)
  lang_code: b                # British English (Kokoro)
  sample_rate: 24000          # Kokoro and Chatterbox both output 24 kHz
  chatterbox_python: .venv-chatterbox/bin/python   # own env: chatterbox-tts pins torch 2.6 (missing = Kokoro fallback)

music:
  generate: true              # make a bed when a board has no music file
  backend: procedural         # numpy bed, no model (no GPU here); config.pc.yaml uses ace_step on the PC's ComfyUI
  seed: 7
  gain_db_under_vo: -21
  gain_db_solo: -6

publish:
  mode: outbox                # outbox only — nothing is pushed to Meta automatically

# No gpu_gate / comfy_cheq here: this machine has no GPU (cqf/gpu_gate.py is a no-op without an enabled gpu_gate
# block). The PC's config.pc.yaml has both.
