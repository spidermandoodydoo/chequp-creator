<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Weights</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface-primary);font-family:var(--font-core);color:var(--color-primary-dark)}
.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--r-xs)}
.n{font-size:11px;font-weight:600;line-height:1.2}.v{font-size:10px;font-weight:400;color:var(--color-primary-dark-60);font-family:var(--font-mono)}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:flex-end}</style>
</head><body><div style="display:flex;flex-direction:column;gap:10px;font-size:22px;letter-spacing:var(--tracking-tight)">
<span style="font-weight:400">Regular 400 — body, quotes, chip labels</span>
<span style="font-weight:500">Medium 500 — emphasis, table leads, alert titles</span>
<span style="font-weight:600">SemiBold 600 — headings, buttons, nav, tags</span>
<span style="font-weight:400;font-size:12px;color:var(--color-primary-dark-60)">Bold 700 is deliberately absent.</span>
</div></body></html>
