<!-- @dsCard group="Colors" viewport="700x190" name="Category accents" subtitle="Five themes; each has an AA-safe deep tone and a light tone" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Category accents</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface-primary);font-family:var(--font-core);color:var(--color-primary-dark)}
.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--r-xs)}
.n{font-size:11px;font-weight:600;line-height:1.2}.v{font-size:10px;font-weight:400;color:var(--color-primary-dark-60);font-family:var(--font-mono)}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:flex-end}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw"><div class="chip" style="background:var(--color-category-orchid)"></div><span class="n">orchid</span><span class="v">#A30177</span></div>
<div class="sw"><div class="chip" style="background:var(--color-category-mulberry)"></div><span class="n">mulberry</span><span class="v">#710035</span></div>
<div class="sw"><div class="chip" style="background:var(--color-category-tangerine)"></div><span class="n">tangerine</span><span class="v">#B33600</span></div>
<div class="sw"><div class="chip" style="background:var(--color-category-willow)"></div><span class="n">willow</span><span class="v">#007366</span></div>
<div class="sw"><div class="chip" style="background:var(--color-category-horizon)"></div><span class="n">horizon</span><span class="v">#005C99</span></div>
<div class="sw"><div class="chip" style="background:var(--color-category-orchid-light)"></div><span class="n">orchid-light</span><span class="v">#FEC5F0</span></div>
<div class="sw"><div class="chip" style="background:var(--color-category-mulberry-light)"></div><span class="n">mulberry-light</span><span class="v">#FFB6BC</span></div>
<div class="sw"><div class="chip" style="background:var(--color-category-tangerine-light)"></div><span class="n">tangerine-light</span><span class="v">#FFE4A9</span></div>
<div class="sw"><div class="chip" style="background:var(--color-category-willow-light)"></div><span class="n">willow-light</span><span class="v">#A9FFE7</span></div>
<div class="sw"><div class="chip" style="background:var(--color-category-horizon-light)"></div><span class="n">horizon-light</span><span class="v">#B0E0FF</span></div>
</div></body></html>
