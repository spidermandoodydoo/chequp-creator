<!-- @dsCard group="Colors" viewport="700x130" name="On Primary Dark" subtitle="Sand alphas for text and rules on Midnight" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>On Primary Dark</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface-primary);font-family:var(--font-core);color:var(--color-primary-dark)}
.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--r-xs)}
.n{font-size:11px;font-weight:600;line-height:1.2}.v{font-size:10px;font-weight:400;color:var(--color-primary-dark-60);font-family:var(--font-mono)}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:flex-end}</style>
</head><body><div style="background:var(--color-primary-dark);border-radius:var(--r-sm);padding:14px"><div class="grid" style="grid-template-columns:repeat(6,1fr)">
<div class="sw"><div class="chip" style="background:var(--color-on-primary-base)"></div><span class="n" style="color:var(--color-on-primary-base)">base</span><span class="v" style="color:var(--color-on-primary-62)">Sand</span></div>
<div class="sw"><div class="chip" style="background:var(--color-on-primary-92)"></div><span class="n" style="color:var(--color-on-primary-base)">92</span><span class="v" style="color:var(--color-on-primary-62)">headings</span></div>
<div class="sw"><div class="chip" style="background:var(--color-on-primary-88)"></div><span class="n" style="color:var(--color-on-primary-base)">88</span><span class="v" style="color:var(--color-on-primary-62)">body</span></div>
<div class="sw"><div class="chip" style="background:var(--color-on-primary-62)"></div><span class="n" style="color:var(--color-on-primary-base)">62</span><span class="v" style="color:var(--color-on-primary-62)">regulatory</span></div>
<div class="sw"><div class="chip" style="background:var(--color-on-primary-24)"></div><span class="n" style="color:var(--color-on-primary-base)">24</span><span class="v" style="color:var(--color-on-primary-62)">tracks</span></div>
<div class="sw"><div class="chip" style="background:var(--color-on-primary-16)"></div><span class="n" style="color:var(--color-on-primary-base)">16</span><span class="v" style="color:var(--color-on-primary-62)">rules</span></div>
</div></div></body></html>
