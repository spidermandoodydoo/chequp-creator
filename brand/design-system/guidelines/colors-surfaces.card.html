<!-- @dsCard group="Colors" viewport="700x130" name="Surfaces" subtitle="Primary is the page; Tertiary lifts off it" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Surfaces</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface-primary);font-family:var(--font-core);color:var(--color-primary-dark)}
.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--r-xs)}
.n{font-size:11px;font-weight:600;line-height:1.2}.v{font-size:10px;font-weight:400;color:var(--color-primary-dark-60);font-family:var(--font-mono)}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:flex-end}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(6,1fr)">
<div class="sw"><div class="chip" style="background:var(--color-surface-primary);box-shadow:var(--hairline-card)"></div><span class="n">surface/primary</span><span class="v">Sand</span></div>
<div class="sw"><div class="chip" style="background:var(--color-surface-secondary)"></div><span class="n">surface/secondary</span><span class="v">Dark Sand</span></div>
<div class="sw"><div class="chip" style="background:var(--color-surface-tertiary);box-shadow:var(--hairline-card)"></div><span class="n">surface/tertiary</span><span class="v">White</span></div>
<div class="sw"><div class="chip" style="background:var(--color-surface-tint);box-shadow:var(--hairline-card)"></div><span class="n">surface/tint</span><span class="v">#FBF7F2</span></div>
<div class="sw"><div class="chip" style="background:var(--color-surface-selected);box-shadow:var(--hairline-card)"></div><span class="n">surface/selected</span><span class="v">#F4EFFF</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-dark)"></div><span class="n">primary/dark</span><span class="v">Midnight</span></div>
</div></body></html>
