<!-- @dsCard group="Type" viewport="700x160" name="Responsive ramp" subtitle="Display 1 and Heading 1 across the four breakpoint modes" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Responsive ramp</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface-primary);font-family:var(--font-core);color:var(--color-primary-dark)}
.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--r-xs)}
.n{font-size:11px;font-weight:600;line-height:1.2}.v{font-size:10px;font-weight:400;color:var(--color-primary-dark-60);font-family:var(--font-mono)}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:flex-end}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(4,1fr);align-items:end">
<div class="sw"><span style="font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em">44</span><span class="n">Mobile</span><span class="v">display-1 44 / h1 36</span></div>
<div class="sw"><span style="font-size:60px;font-weight:600;line-height:1;letter-spacing:-.02em">60</span><span class="n">Tablet</span><span class="v">display-1 60 / h1 48</span></div>
<div class="sw"><span style="font-size:80px;font-weight:600;line-height:1;letter-spacing:-.02em">80</span><span class="n">Desktop</span><span class="v">display-1 80 / h1 64</span></div>
<div class="sw"><span style="font-size:80px;font-weight:600;line-height:1;letter-spacing:-.02em">80</span><span class="n">Wide</span><span class="v">same as desktop</span></div>
</div></body></html>
