<!-- @dsCard group="Colors" viewport="700x130" name="Ink alphas" subtitle="Midnight at the alphas the kit actually uses" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Ink alphas</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface-primary);font-family:var(--font-core);color:var(--color-primary-dark)}
.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--r-xs)}
.n{font-size:11px;font-weight:600;line-height:1.2}.v{font-size:10px;font-weight:400;color:var(--color-primary-dark-60);font-family:var(--font-mono)}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:flex-end}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(8,1fr)">
<div class="sw"><div class="chip" style="background:var(--color-primary-dark-04);box-shadow:var(--hairline-card)"></div><span class="n">04</span><span class="v">hairline fill</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-dark-06);box-shadow:var(--hairline-card)"></div><span class="n">06</span><span class="v">quiet fill</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-dark-08);box-shadow:var(--hairline-card)"></div><span class="n">08</span><span class="v">card ring</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-dark-12);box-shadow:var(--hairline-card)"></div><span class="n">12</span><span class="v">quiet ring</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-dark-24)"></div><span class="n">24</span><span class="v">strong ring</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-dark-48)"></div><span class="n">48</span><span class="v">field ring</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-dark-64)"></div><span class="n">64</span><span class="v">muted label</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-dark-72)"></div><span class="n">72</span><span class="v">body on light</span></div>
</div></body></html>
