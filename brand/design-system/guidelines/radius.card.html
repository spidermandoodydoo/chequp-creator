<!-- @dsCard group="Spacing" viewport="700x140" name="Radius" subtitle="One rounded family. 20px is the panel step; 999 is the pill." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Radius</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface-primary);font-family:var(--font-core);color:var(--color-primary-dark)}
.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--r-xs)}
.n{font-size:11px;font-weight:600;line-height:1.2}.v{font-size:10px;font-weight:400;color:var(--color-primary-dark-60);font-family:var(--font-mono)}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:flex-end}</style>
</head><body><div class="row" style="align-items:flex-start">
<div class="sw"><div style="width:72px;height:56px;background:var(--color-surface-tertiary);box-shadow:var(--hairline-card);border-radius:4px"></div><span class="n">xxs</span><span class="v">4px</span></div><div class="sw"><div style="width:72px;height:56px;background:var(--color-surface-tertiary);box-shadow:var(--hairline-card);border-radius:8px"></div><span class="n">xs</span><span class="v">8px</span></div><div class="sw"><div style="width:72px;height:56px;background:var(--color-surface-tertiary);box-shadow:var(--hairline-card);border-radius:12px"></div><span class="n">chip</span><span class="v">12px</span></div><div class="sw"><div style="width:72px;height:56px;background:var(--color-surface-tertiary);box-shadow:var(--hairline-card);border-radius:16px"></div><span class="n">sm</span><span class="v">16px</span></div><div class="sw"><div style="width:72px;height:56px;background:var(--color-surface-tertiary);box-shadow:var(--hairline-card);border-radius:20px"></div><span class="n">panel</span><span class="v">20px</span></div><div class="sw"><div style="width:72px;height:56px;background:var(--color-surface-tertiary);box-shadow:var(--hairline-card);border-radius:24px"></div><span class="n">md</span><span class="v">24px</span></div><div class="sw"><div style="width:72px;height:56px;background:var(--color-surface-tertiary);box-shadow:var(--hairline-card);border-radius:48px"></div><span class="n">lg</span><span class="v">48px</span></div><div class="sw"><div style="width:72px;height:56px;background:var(--color-surface-tertiary);box-shadow:var(--hairline-card);border-radius:80px"></div><span class="n">xl</span><span class="v">80px</span></div>
<div class="sw"><div style="width:72px;height:56px;background:var(--color-surface-tertiary);box-shadow:var(--hairline-card);border-radius:999px"></div><span class="n">full</span><span class="v">999px</span></div>
</div></body></html>
