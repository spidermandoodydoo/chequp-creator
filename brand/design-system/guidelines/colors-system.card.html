<!-- @dsCard group="Colors" viewport="700x190" name="System colours" subtitle="Success, warning, error, info — deep and tint" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>System colours</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface-primary);font-family:var(--font-core);color:var(--color-primary-dark)}
.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--r-xs)}
.n{font-size:11px;font-weight:600;line-height:1.2}.v{font-size:10px;font-weight:400;color:var(--color-primary-dark-60);font-family:var(--font-mono)}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:flex-end}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(4,1fr)">
<div class="sw"><div class="chip" style="background:var(--color-system-success-deep)"></div><span class="n">success/deep</span><span class="v">#0B7038</span></div>
<div class="sw"><div class="chip" style="background:var(--color-system-warning-deep)"></div><span class="n">warning/deep</span><span class="v">#A25F1A</span></div>
<div class="sw"><div class="chip" style="background:var(--color-system-error-deep)"></div><span class="n">error/deep</span><span class="v">#C41230</span></div>
<div class="sw"><div class="chip" style="background:var(--color-system-info-deep)"></div><span class="n">info/deep</span><span class="v">#4A5A6B</span></div>
<div class="sw"><div class="chip" style="background:var(--color-system-success-tint)"></div><span class="n">success/tint</span><span class="v">#DCEFE2</span></div>
<div class="sw"><div class="chip" style="background:var(--color-system-warning-tint)"></div><span class="n">warning/tint</span><span class="v">#FFD4A3</span></div>
<div class="sw"><div class="chip" style="background:var(--color-system-error-tint)"></div><span class="n">error/tint</span><span class="v">#FADCDF</span></div>
<div class="sw"><div class="chip" style="background:var(--color-system-info-tint)"></div><span class="n">info/tint</span><span class="v">#E2E7EC</span></div>
</div></body></html>
