<!-- @dsCard group="Brand" viewport="700x150" name="Page dividers" subtitle="Three sanctioned colour transitions" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Page dividers</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface-primary);font-family:var(--font-core);color:var(--color-primary-dark)}
.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--r-xs)}
.n{font-size:11px;font-weight:600;line-height:1.2}.v{font-size:10px;font-weight:400;color:var(--color-primary-dark-60);font-family:var(--font-mono)}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:flex-end}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(3,1fr)">
<div class="sw"><div style="position:relative;height:96px;overflow:hidden;background:var(--color-surface-primary);border-radius:var(--r-xs)"><div style="position:absolute;left:-4%;right:-4%;top:27px;height:96px;border-radius:50%;background:var(--color-primary-dark)"></div></div><span class="n">Sand to Dark</span></div><div class="sw"><div style="position:relative;height:96px;overflow:hidden;background:var(--color-primary-dark);border-radius:var(--r-xs)"><div style="position:absolute;left:-4%;right:-4%;top:27px;height:96px;border-radius:50%;background:var(--color-primary-light)"></div></div><span class="n">Dark to Lavender</span></div><div class="sw"><div style="position:relative;height:96px;overflow:hidden;background:var(--color-primary-base);border-radius:var(--r-xs)"><div style="position:absolute;left:-4%;right:-4%;top:27px;height:96px;border-radius:50%;background:var(--color-surface-primary)"></div></div><span class="n">Purple to Sand</span></div>
</div></body></html>
