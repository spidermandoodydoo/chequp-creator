<!-- @dsCard group="Colors" viewport="700x130" name="Brand core" subtitle="Purple, Lavender, Midnight, Sand, Sunflower" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Brand core</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface-primary);font-family:var(--font-core);color:var(--color-primary-dark)}
.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--r-xs)}
.n{font-size:11px;font-weight:600;line-height:1.2}.v{font-size:10px;font-weight:400;color:var(--color-primary-dark-60);font-family:var(--font-mono)}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:flex-end}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(6,1fr)">
<div class="sw"><div class="chip" style="background:var(--brand-purple)"></div><span class="n">Purple</span><span class="v">#683CF5</span></div>
<div class="sw"><div class="chip" style="background:var(--brand-lavender)"></div><span class="n">Lavender</span><span class="v">#D7BEFF</span></div>
<div class="sw"><div class="chip" style="background:var(--brand-midnight)"></div><span class="n">Midnight</span><span class="v">#210847</span></div>
<div class="sw"><div class="chip" style="background:var(--brand-sand);box-shadow:var(--hairline-card)"></div><span class="n">Sand</span><span class="v">#FFF6EB</span></div>
<div class="sw"><div class="chip" style="background:var(--brand-dark-sand)"></div><span class="n">Dark Sand</span><span class="v">#F2E6D9</span></div>
<div class="sw"><div class="chip" style="background:var(--brand-sunflower)"></div><span class="n">Sunflower</span><span class="v">#FFEB57</span></div>
</div></body></html>
