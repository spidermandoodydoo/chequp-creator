<!-- @dsCard group="Colors" viewport="700x130" name="Primary interaction states" subtitle="Base, hover, active for purple and lavender" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Primary interaction states</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface-primary);font-family:var(--font-core);color:var(--color-primary-dark)}
.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--r-xs)}
.n{font-size:11px;font-weight:600;line-height:1.2}.v{font-size:10px;font-weight:400;color:var(--color-primary-dark-60);font-family:var(--font-mono)}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:flex-end}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(6,1fr)">
<div class="sw"><div class="chip" style="background:var(--color-primary-base)"></div><span class="n">primary/base</span><span class="v">#683CF5</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-hover)"></div><span class="n">primary/hover</span><span class="v">#5A2FE0</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-active)"></div><span class="n">primary/active</span><span class="v">#4A24BF</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-light)"></div><span class="n">primary/light</span><span class="v">#D7BEFF</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-light-hover)"></div><span class="n">light-hover</span><span class="v">#C7A6FF</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-light-active)"></div><span class="n">light-active</span><span class="v">#B98FFF</span></div>
</div></body></html>
