# CheqUp — Meta paid social video. Same preset shape as shorts-factory's
# presets/*.yaml, plus the brand + compliance blocks a regulated advertiser needs.
name: chequp_meta
brand: CheqUp
product: The CheqUp Method — weight-health membership (Clinician, Health Coach, WeightWatchers app, plan)
landing_default: LANDING-URL-TBC   # needs a legal-approved LP. NOT /how-it-works: it names Mounjaro/Wegovy, shows pens and 'one dose taken weekly' (checked 8 Oct)

audience:
  primary: Women 35–64 in the UK (566 of 680 purchases; best CPA women 35–44 £196, volume women 55–64)
  secondary: Women 65+ (highest CTR 1.05%, CPA £338 — needs clearer, slower cuts)
  test_only: Men 45–64 (CPA ~£470)
  age_min: 18          # Meta policy for weight-management ads

formats:               # every concept renders all three unless it says otherwise
  "9x16": {placements: [FB Reels, IG Reels, Stories, Reels overlay], hook_by_s: 1.5}
  "4x5":  {placements: [FB Feed, IG Feed]}
  "1x1":  {placements: [Audience Network, Marketplace]}
  "16x9": {placements: [VOD, YouTube, connected TV]}   # only when a board lists it
exclude_placements: [Facebook in-stream video]   # £3,628 CPA over 90 days

design_system: brand/design-system
unlicensed_assets:     # Stocksy watermarked comps inside the design-system kit — never in an ad until licensed
  - 1de894af3390969a.jpg   # Peninsula / Stocksy 6950238
  - 8a5a6edf3ad2e4e1.jpg   # DZ FILM / Stocksy 7340865
  - f02b703f91f681a7.jpg   # Adrian Rodd / Stocksy 7164755          # CheqUp Digital Design System (tokens, fonts, assets)
default_mode: weight-health                  # data-mode theme; others: women-s-health, cardiovascular

voice:   # cqf/voice.py. Upbeat British newsreader read; listen before any production run (8 Oct tests were measured, not heard)
  engine: chatterbox               # chatterbox | kokoro. Falls back to Kokoro per line if config chatterbox_python or the ref is missing
  voices: ["bf_emma,bf_alice"]     # Kokoro voice: 50/50 blend keeps emma's sound with alice's movement (pitch SD 2.2 -> 3.6 st)
  speed: 1.05                      # Kokoro only. Chatterbox has no speed knob: pace follows cfg_weight (lower = slower)
  words_per_second: 2.9            # silent-render estimate (~175 wpm incl. pauses)
  dialogue_gap_s: 0.3
  chatterbox:                      # original 0.5B English model (Turbo/Nano ignore exaggeration + cfg_weight)
    # Profile "bouncy" (Dan's pick of 8 Oct = sample 1): bootstrapped lively reference, energy 0.85, pauses tightened.
    #   Day 23 script: pitch SD 4.6 st (was 2.8), brighter (232 Hz), inner pauses capped at 0.15 s.
    # Alternatives: "fluid"  = ref announcer_ref.wav, exaggeration 0.9, cfg_weight 0.4, temperature 0.9, tighten on (3.5 st, quickest)
    #               "steady" = ref announcer_ref.wav, exaggeration 0.7, cfg_weight 0.5, temperature 0.8, no tighten (first recommendation)
    ref: brand/voice/announcer_bouncy_ref.wav   # Chatterbox read of a promo paragraph from the Kokoro-made announcer_ref: synthetic, no real person
    exaggeration: 0.85
    cfg_weight: 0.4
    temperature: 0.9
    tighten_pauses: {max_gap: 0.22, to: 0.15}
    takes: 3                       # all takes kept as vo/sNN_J.tN.wav; Whisper picks the best, swap by ear if needed
    seed: 1234
  styles:                          # a line opts in with "style": "<name>"
    tagline: {exaggeration: 0.5, cfg_weight: 0.3, tempo: 0.8, speed: 0.9, pause_before: 0.35}   # "That’s The CheqUp Method.": a beat, then slower (Numan's end lines run at half pace)
  cast:                            # dialogue roles: scene "vo": [{"voice": "<role>", "text": "..."}]; boards can override via "voices"
    announcer: {}                  # the defaults above
    chequp: {}                     # the CheqUp staffer in a dialogue = the announcer voice
    customer: {ref: brand/voice/customer_ref.wav, exaggeration: 0.5, cfg_weight: 0.5, voice: bf_isabella}
    male: {engine: kokoro, voice: bm_fable, speed: 1.05}   # male test cut (Kokoro bm_fable: pitch SD 4.5 st; bm_george drops -10 st at line ends)
  lexicon: {}                      # extra spoken-only respellings: {kokoro: {regex: respelling}, chatterbox: {...}}; CheqUp is built in
  master:                          # VO stem only; render.mjs then takes the full mix to -14 LUFS / -1 dBTP
    pitch_st: 0                    # formant-preserving lift; 0.5 only for an all-Kokoro render, never above 1
    # filters: default = voice.MASTER (80 Hz HPF, -2 dB @250, +2.5 dB @3.5k, +1.5 dB shelf @9k, de-ess, 3:1 comp, -16 LUFS / -1.5 dBTP)

writer_rules:
  - Second person, present tense, no hedging. The reader is "you"; CheqUp is "we".
  - Sentence case for every heading. Only eyebrows and tags are uppercase.
  - Contractions yes, exclamation marks no, emoji never. Curly apostrophes (’).
  - Buttons and CTAs state the outcome ("Check my eligibility", "See if it’s right for you"), never "Learn more" or "Submit".
  - Every number carries its source on screen. A stat without a source is a claim.
  - Reassure before you explain. Warm, non-judgemental, about connected care rather than the scales.
  - The hero is the service — Clinician, Health Coach, WeightWatchers app, the plan. Never the medicine.
  - The first 1.5 seconds must carry the hook as on-screen text from frame 0 (native Reels hooks are the weak point in the account).
  - Positive framing only. Never describe the viewer's body, weight or feelings about it.

never:     # enforced by cqf/compliance.py — hard fails, not warnings
  - Naming or implying a prescription-only medicine (brand, generic, "jab", "injection", "pen", "pill", "tablet", "oral", "GLP-1")
  - Showing pens, needles, syringes, vials, pill packs, injecting, or the syringe/pill icons
  - Before/after imagery, body close-ups, scales as a hero, measuring tapes on bodies
  - Asserting personal attributes (e.g. "Are you overweight?", "your belly")
  - Efficacy superlatives or kg-lost claims ("most effective", "lose 2 stone")
  - Speed claims such as "2 minute consultation" (upheld ruling A24-1264775)
  - AI-generated people presented as members, clinicians or reviewers; fabricated testimonials
  - Real-person likeness without consent (celebrities, WW ambassadors)
  - The CheqUp Loop graphic (design system: not for digital advertising or campaign work)
  - Gradients, textures, drop shadows, weight 700, colours outside the token set
  - Recognisable AI-generated faces (AI plates show hands, objects, places, backs or distant figures only)
  - Anyone who looks under 25 or underweight (CAP 13.3)
  - Mirrors or appearance checks
  - Stock content passed through AI models

approvals_required:      # flags that put a render into HOLD until a human signs off
  price: Legal sign-off — frame as the membership, not the medicine
  weightwatchers: WeightWatchers brand approval under the partnership agreement
  stat: Source + sample size on file
  review: Verbatim review held on file, with the reviewer's permission

broll:
  # Prompt rules: reference/broll-prompt-rules.md. Shot policy: reference/broll-shot-policy.md.
  look_positive: "Editorial lifestyle photograph on a full-frame digital camera, candid and unposed. Warm natural sunlight with crisp, defined shadows, balanced exposure, true-to-life colour, natural contrast, clean whites, sharp focus and fine real texture."
  look_legacy_ab_only: >-   # the old `look`; farm.py never sends it. Read only by scripts/ab_grid.py variant A; delete after the A/B
    warm natural daylight, mid-tone, real everyday British homes and streets, unstyled,
    candid documentary feel, no colour grading, no duotone, no film grain, 35mm lens,
    vertical composition with the main subject and faces in the lower half of the frame and calm
    empty space (wall, sky, soft background) in the upper third, where the text card sits
  people: >-
    AI plates never contain a recognisable face. Allowed: hands and forearms; one adult (40s-60s, everyday
    clothes) seen from behind or at a distance; distant out-of-focus figures. Every shot carries a people tag.
    Anyone the script treats as "her", any face, member, coach or clinician comes from real, released photography.
  people_add_on:
    none: "person, people, face, hands, arm, portrait"
    hands: "face, head, hair, portrait, looking at the camera, second person, extra hands"
    hands_pair: "face, head, hair, portrait, looking at the camera, third person, extra hands"
    back_view: "face, front view, profile, portrait, looking at the camera, close-up"
    distant: "face, portrait, looking at the camera, close-up, crowd"
  allowed_subjects: [fresh food being prepared (hands only), groceries on a worktop, cup of tea by a window,
    a laid kitchen or garden table with no one at it, trainers by the front door, empty sunlit UK kitchens and
    living rooms, park paths and terraced streets, a woman walking away from camera in a park,
    a woman seen from behind in a garden]
  # Qwen-Image runs at cfg 4, so this negative is live. The Chinese suffix is Qwen-Image-2512's official negative (model card).
  negative: "blurry, soft focus, out of focus, hazy, foggy, washed out, low contrast, flat grey light, muddy shadows, overexposed, oversaturated, colour grading, teal and orange, duotone, sepia, film grain, noise, halftone dots, speckled texture, JPEG artefacts, CGI, 3D render, illustration, painting, waxy skin, plastic skin, airbrushed skin, doll-like face, portrait, close-up of a face, looking at the camera, stock photo pose, posing for the camera, child, teenager, school uniform, underweight, very thin, deformed hands, extra fingers, fused fingers, missing fingers, malformed limbs, mushy food, melted vegetables, cluttered composition, text, caption, subtitles, watermark, logo, brand name, lit phone screen, syringe, needle, injection pen, pen, marker pen, pills, tablets, capsules, medicine box, vial, hospital, doctor, nurse, stethoscope, lab coat, scrubs, lanyard, weighing scales, kitchen scales, measuring tape, mirror, before and after, shirtless, bare midriff, body close-up, belly, 低分辨率，低画质，肢体畸形，手指畸形，画面过饱和，蜡像感，人脸无细节，过度光滑，画面具有AI感。构图混乱。文字模糊，扭曲。"
  negative_wan: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"   # verbatim from Wan2.2 shared_config.py sample_neg_prompt
  negative_i2v_extra: "camera shake, handheld wobble, fast motion, sudden movement, morphing, warping hands, extra fingers, flicker, changing light, colour shift, text, watermark, syringe, pills, scales, face"

publish:
  mode: outbox             # same as shorts-factory: build an upload folder + sheet, a human ships it
  naming: "{concept}_{variant}_{format}_v{version}"
  meta_utm: "utm_source=meta&utm_medium=paid_social&utm_campaign={campaign}&utm_content={ad_name}"
