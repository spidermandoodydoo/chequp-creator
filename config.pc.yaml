# chequp-creator runtime config: PC profile, run ON the Windows 5090 PC (C:\Users\white).
#   .venv\Scripts\python.exe -m cqf --config config.pc.yaml ...
# The 5090 also runs shorts-factory, on its own ComfyUI (port 8188). CheqUp has its OWN ComfyUI v0.39.2 next to
# it (comfy_cheq below, port 8288; scripts/install_comfy_cheq_pc.ps1), sharing the model files read-only, and
# gpu_gate waits before every CheqUp GPU job while shorts-factory has work. shorts-factory's ComfyUI, its venv and
# its files are never modified, restarted or sent anything but GET /queue and GET /system_stats: no pause needed.
# chequp-creator runtime config. Same shape as shorts-factory's config.yaml where the
# concepts overlap (farm.machines, models.wan22, qa.*, publish.mode).

preset: presets/chequp_meta.yaml
data_dir: data
out_dir: out

# --- mama: Linux box, 7x RTX 3090 (24 GB). Reached over Tailscale. --------------------------
# Two jobs compete for the same 7 cards, so production runs in two phases
# (see mama/cq_phase.sh):  plan  = Qwen3-235B in LM Studio across all 7 cards
#                          render = ComfyUI, one server per card, Wan 2.2 b-roll
mama:
  host: 100.75.169.5          # Tailscale; LAN is 192.168.0.193

llm:
  backend: claude_cli         # the PC's Claude Code CLI (find_claude also checks %APPDATA%\Claude\claude-code)
  fallback: null              # no LM Studio-on-mama fallback: CheqUp never sends anything to mama (base_url unused)
  base_url: http://100.75.169.5:1234/v1
  model: qwen/qwen3-235b-a22b-2507
  temperature: 0.7
  max_tokens: 6000
  timeout_s: 600

farm:
  machines:
    - name: mama
      host: 100.75.169.5
      first_port: 8189        # GPU0/8188 is Dan's own ComfyUI; the farm is GPUs 1-6 (8189-8194)
      gpus: 6
      role: broll
      enabled: false          # CheqUp never uses mama (Dan, 8 Oct: "not mama, mama is getting hot")
    - name: pc-5090
      host: 127.0.0.1
      first_port: 8288        # CheqUp's own ComfyUI (comfy_cheq), never 8188 (shorts-factory's: gpu_gate.yield_to)
      gpus: 1
      role: hero              # models: shorts-factory's models folder, shared read-only via extra_model_paths.yaml
      enabled: true
  probe_timeout_s: 5
  job_timeout_s: 1800         # one still: Qwen 50 steps x4 seeds + SeedVR2 7B
  clip_timeout_s: 10800       # one i2v clip: Wan 30 steps + SeedVR2 + FILM

models:
  qwen_image:                 # stills: Qwen-Image-2512 fp8, 50 steps, cfg 4, shift 3.1, SeedVR2 7B 2x in-graph
    graph: cqf/graphs/qwen_still.json
    sizes: {"9x16": [928, 1664], "16x9": [1664, 928]}
  seedvr2:
    unet: seedvr2_7b_fp16.safetensors     # seedvr2_7b_fp8_e4m3fn.safetensors if the PC has < 64 GB RAM
    vae: seedvr2_ema_vae_fp16.safetensors
  ace_step:
    checkpoint: ace_step_1.5_turbo_aio.safetensors
  wan22:                      # identical files to shorts-factory (Comfy-Org fp8 + lightx2v 4-step)
    t2v_high: wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors
    t2v_low: wan2.2_t2v_low_noise_14B_fp8_scaled.safetensors
    t2v_lora_high: wan2.2_t2v_lightx2v_4steps_lora_v1.1_high_noise.safetensors
    t2v_lora_low: wan2.2_t2v_lightx2v_4steps_lora_v1.1_low_noise.safetensors
    i2v_high: wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
    i2v_low: wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
    i2v_lora_high: wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors
    i2v_lora_low: wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors
    text_encoder: umt5_xxl_fp8_e4m3fn_scaled.safetensors
    vae: wan_2.1_vae.safetensors
    width: 720
    height: 1280
    frames: 81                # ~5 s at 16 fps
    fps: 16
    steps: 4                  # legacy draft path only; the quality clip graph is below
    shift: 8.0
    clip:                     # i2v: 30 steps, cfg 3.5, shift 5, switch at 11 -> SeedVR2 1.5x -> FILM 2x (30 fps)
      graph: cqf/graphs/wan_i2v_clip.json
      sizes: {"9x16": [720, 1280], "16x9": [1280, 720]}
      frames: 81

broll:
  candidates: 4               # seeds per shot; Claude vision scores them and keeps the best
  qa: claude_vision           # claude_vision | none
  max_rerolls: 1

render:
  formats: ["9x16", "4x5", "1x1"]
  fps: 30
  jobs: 4                     # parallel Chromium pages
  node: node

voice:
  backend: tts                # tts | none  (engine per line: presets/*.yaml voice block)
  lang_code: b                # British English (Kokoro)
  sample_rate: 24000
  chatterbox_python: .venv-chatterbox/Scripts/python.exe   # torch 2.7.1 cu128 env from scripts/setup_pc.ps1

music:
  generate: true
  backend: ace_step           # ACE-Step 1.5 on CheqUp's ComfyUI (8288); falls back to the procedural bed
  seed: 7                     # beds are cached in out/music by look, length, seed and checkpoint: change for a new take
  gain_db_under_vo: -21
  gain_db_solo: -6

publish:
  mode: outbox                # outbox only — nothing is pushed to Meta automatically

shorts_factory:               # shares this PC's GPU (its own ComfyUI on 8188). pc_run -PauseFactory is optional now
  dir: C:\Users\white\heatmap\shorts-factory   # paused while <dir>\data\STOP exists; only Dan resumes it

comfy_cheq:                   # CheqUp's own ComfyUI v0.39.2 (scripts/install_comfy_cheq_pc.ps1, comfy_cheq_start.ps1)
  dir: C:\Users\white\ComfyUI-CheqUp
  port: 8288

gpu_gate:                     # cqf/gpu_gate.py: wait before each CheqUp GPU job on this PC, so shorts-factory goes first
  enabled: true
  yield_to:                   # GET /queue (+ GET /system_stats while VRAM is short) only; never POST, /free or /interrupt
    - {url: "http://127.0.0.1:8188", name: shorts-factory}
  need_free_vram_gb: 22       # free VRAM to wait for (nvidia-smi; what CheqUp's own ComfyUI holds counts as free)
  need_gb: {still: 22, clip: 26, ace: 12, chatterbox: 6}
  poll_s: 30
  quiet_s: 60                 # once shorts-factory had work, start only after 60 s without any (not between its jobs)
  share_kinds: [chatterbox, ace]   # small jobs don't wait for the factory's queue (busy 24/7): they start when free VRAM
  share_headroom_gb: 4             # covers need_gb + this headroom, and fall back (Kokoro / procedural bed) after
  share_max_wait_s: 900            # 15 min instead of stopping the run. Stills and clips still wait for a real gap.
  log_every_s: 300
  max_wait_s: 21600           # 6 h, then GpuBusy: the rest of the run is skipped (pc_run exit 12)
